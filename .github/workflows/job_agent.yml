name: Agente de Empleo — Diego

on:
  schedule:
    # 11:00 UTC = 06:00 COL (UTC-5). Ajustar a 10:30 UTC para llegar antes de las 8am.
    - cron: "30 10 * * *"
  workflow_dispatch:  # Permite ejecución manual desde GitHub UI

jobs:
  job-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ── 1. Checkout del repo ───────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Python setup ───────────────────────────────────
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      # ── 3. Instalar dependencias ──────────────────────────
      - name: Instalar dependencias
        run: |
          pip install httpx beautifulsoup4 lxml gspread google-auth

      # ── 4. Scraping ───────────────────────────────────────
      - name: Scraping portales
        run: python scraper.py
        continue-on-error: false   # Si falla el scraping, detiene el workflow

      # ── 5. Scoring y filtrado ──────────────────────────────
      - name: Debug scorer
        run: |
          echo "=== RUTA ==="
          find . -name "scorer.py"
          echo "=== LÍNEAS 1-20 ==="
          head -20 scorer.py
      - name: Scoring y filtrado
        run: python scorer.py

      # ── 6. Escribir en Google Sheets ──────────────────────
      - name: Escribir en Google Sheets
        run: python sheets_writer.py
        env:
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        # Si Sheets falla, el email igual se envía con los datos en memoria
        continue-on-error: true

      # ── 7. Enviar email ────────────────────────────────────
      - name: Enviar email diario
        run: python mailer.py
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        # El email es crítico. Si falla, el job falla y GitHub te notifica.
        continue-on-error: false

      # ── 8. Upload de artefactos para debug ────────────────
      - name: Guardar logs de ejecución
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: job-agent-logs-${{ github.run_id }}
          path: |
            jobs_raw.json
            jobs_scored.json
            write_result.json
          retention-days: 7

      # ── 9. Notificación de fallo (built-in de GitHub) ─────
      # GitHub envía email automático al dueño del repo si el workflow falla.
      # No requiere configuración adicional.
